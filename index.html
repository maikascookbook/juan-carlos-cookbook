<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf6f3"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>My Cookbook</title></head><body><header><button id="brand" class="brand">MY COOKBOOK</button><nav><button data-view="home">Home</button><button data-view="recipes">Recipes</button><button data-view="notes">Kitchen Notes</button><button id="customize" hidden>Customize</button></nav><div class="right"><button id="login">Owner sign in</button><button id="add" class="primary" hidden>+ Add recipe</button></div></header><main id="app"></main><footer id="footer">Made with love, one recipe at a time.</footer><dialog id="editor"><form id="recipeForm"><h2 id="editTitle">Add recipe</h2><label>Recipe title<input name="title" required></label><label>Category<select name="category" id="categorySelect"></select></label><div class="two"><label>Cooking time<input name="time"></label><label>Servings<input name="servings"></label></div><label>Short introduction<textarea name="description" rows="2"></textarea></label><label>Ingredients — one per line<textarea name="ingredients" rows="7" required></textarea></label><label>Method — one step per line<textarea name="method" rows="8" required></textarea></label><label>Kitchen notes<textarea name="notes" rows="3"></textarea></label><label>Photograph URL<input type="url" name="image" placeholder="https://..."></label><label>Or upload from gallery<input type="file" id="photo" accept="image/*"></label><p class="muted" id="uploadStatus"></p><div class="row"><button type="button" class="close">Cancel</button><button class="primary" type="submit">Save recipe</button></div></form></dialog><dialog id="loginDialog"><form id="loginForm"><h2>Owner sign in</h2><p class="muted">Visitors can browse without an account.</p><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><p id="loginError" class="error"></p><div class="row"><button type="button" class="close">Cancel</button><button class="primary">Sign in</button></div></form></dialog><script src="config.js"></script><script src="app.js"></script></body></html>
